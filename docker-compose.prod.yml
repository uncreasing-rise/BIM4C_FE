# Production on a VPS behind the shared Caddy (network "edge", see the BIM4C 4D/5D
# repo deploy/edge). Values come from .env on the server (chmod 600), never git.
#   docker compose -f docker-compose.prod.yml up -d --build
# NEXT_PUBLIC_* are baked in at build time: rebuild after changing them.
services:
  web:
    # CI/CD sets FE_IMAGE=ghcr.io/…:<commit> (deploy-app); unset builds locally.
    image: ${FE_IMAGE:-fe-web}
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?}
        NEXT_PUBLIC_CDN_URL: ${NEXT_PUBLIC_CDN_URL:-}
        # The build cannot reach the API container; pages rendered at build use the public API.
        BACKEND_URL: ${NEXT_PUBLIC_API_URL:?}
    restart: unless-stopped
    env_file: .env
    networks:
      edge:
        aliases: [bim4c-web]
    stop_grace_period: 20s

networks:
  edge:
    external: true
