name: CI/CD

# Push to main: verify -> build image -> push to GHCR -> deploy to the VPS (deploy-app on
# the server swaps the container, waits for healthy, rolls back if not). Pull requests
# only verify. NEXT_PUBLIC_* for the image come from the repository variables.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a deploy half-way on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Detail pages render on demand, so the build does not need a live API.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:9
      BACKEND_URL: http://127.0.0.1:9
      NEXT_PUBLIC_APP_URL: https://www.bim4c.vn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/uncreasing-rise/bim4c_fe:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker build -t "$IMAGE" \
            --build-arg NEXT_PUBLIC_API_URL="${{ vars.NEXT_PUBLIC_API_URL }}" \
            --build-arg NEXT_PUBLIC_APP_URL="${{ vars.NEXT_PUBLIC_APP_URL }}" \
            --build-arg NEXT_PUBLIC_CDN_URL="${{ vars.NEXT_PUBLIC_CDN_URL }}" \
            --build-arg BACKEND_URL="${{ vars.NEXT_PUBLIC_API_URL }}" .
      - run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push -q "$IMAGE"

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: image
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-bim4c-web
      cancel-in-progress: false
    steps:
      - name: Deploy to VPS
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          # Lives only for this job; the server uses it to pull the image, then logs out.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "root@$VPS_HOST" bim4c-web "$GITHUB_SHA"
