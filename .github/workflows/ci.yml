name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Detail pages render on demand, so the build does not need a live API.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:9
      BACKEND_URL: http://127.0.0.1:9
      NEXT_PUBLIC_APP_URL: https://www.bim4c.vn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
